<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Modelo do grafo SoundGraph</title><desc id="desc">Usuários ouvem músicas, músicas pertencem a gêneros e são criadas por artistas.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#101a32"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".3"/></filter></defs><rect width="1100" height="560" rx="28" fill="url(#bg)"/><text x="55" y="68" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">SoundGraph · modelo de dados</text><text x="55" y="100" fill="#8ea0bd" font-family="Arial,sans-serif" font-size="16">Grafo de preferências musicais para recomendações explicáveis</text><g stroke="#00c2a8" stroke-width="3" fill="none"><path d="M270 245 C370 180 425 180 505 245"/><path d="M665 245 C740 180 800 180 870 245"/><path d="M270 340 C420 425 650 425 870 340"/></g><g fill="#00c2a8" font-family="Arial,sans-serif" font-size="15" font-weight="700"><text x="362" y="190">OUVIU</text><text x="750" y="190">CRIADA_POR</text><text x="530" y="450">PERTENCE_A</text></g><g filter="url(#shadow)" font-family="Arial,sans-serif"><g transform="translate(80 210)"><rect width="190" height="130" rx="18" fill="#17233c" stroke="#4b7bec" stroke-width="2"/><text x="22" y="40" fill="#79a7ff" font-size="22" font-weight="700">Usuario</text><text x="22" y="72" fill="#dbe7ff" font-size="15">id · nome · pais</text><text x="22" y="101" fill="#8ea0bd" font-size="14">perfil e histórico</text></g><g transform="translate(455 210)"><rect width="210" height="130" rx="18" fill="#172f37" stroke="#00c2a8" stroke-width="2"/><text x="22" y="40" fill="#55e4cf" font-size="22" font-weight="700">Musica</text><text x="22" y="72" fill="#dbe7ff" font-size="15">id · titulo · ano</text><text x="22" y="101" fill="#8ea0bd" font-size="14">popularidade</text></g><g transform="translate(850 210)"><rect width="190" height="130" rx="18" fill="#322a46" stroke="#c084fc" stroke-width="2"/><text x="22" y="40" fill="#d8b4fe" font-size="22" font-weight="700">Artista</text><text x="22" y="72" fill="#dbe7ff" font-size="15">id · nome</text><text x="22" y="101" fill="#8ea0bd" font-size="14">autoria</text></g><g transform="translate(455 400)"><rect width="210" height="100" rx="18" fill="#3a2e1d" stroke="#f4c95d" stroke-width="2"/><text x="22" y="40" fill="#f8d879" font-size="22" font-weight="700">Genero</text><text x="22" y="72" fill="#dbe7ff" font-size="15">nome</text></g></g><g fill="#8ea0bd" font-family="Arial,sans-serif" font-size="13"><text x="80" y="535">Relacionamentos carregam reproduções, nota e última vez ouvida.</text></g></svg>
